# Blueprint do Render (https://render.com) para a API do Cineclube XHY.
# No painel do Render: New → Blueprint → selecione este repositório.
# Depois preencha os valores marcados com "sync: false" em Environment.
services:
  - type: web
    name: cineclube-xhy-api
    runtime: node
    plan: free
    region: oregon            # troque para "ohio" ou "frankfurt" se o cluster do Atlas estiver mais perto
    rootDir: codigo-fonte/backend
    # --include=dev garante o TypeScript e os @types no build mesmo com NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false           # string de conexão do MongoDB Atlas
      - key: ADMIN_PASSWORD
        sync: false           # senha do painel /admin
      - key: JWT_SECRET
        generateValue: true   # o Render gera um valor aleatório seguro
      - key: FRONTEND_URL
        sync: false           # https://seudominio.com.br,https://www.seudominio.com.br
      - key: CLOUDINARY_URL
        sync: false           # cloudinary://API_KEY:API_SECRET@CLOUD_NAME
      - key: CLOUDINARY_FOLDER
        value: cineclube-xhy
