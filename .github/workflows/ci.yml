# Integração contínua: lint, formatação, testes e build da API e do site a cada push e PR
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: codigo-fonte/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codigo-fonte/backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # Testes com MongoDB em memória (mongodb-memory-server baixa o binário na primeira vez)
      - run: npm test
      # Testes do harness de carga (trava compartilhada) e do preparo local (iniciar.bat)
      - run: node --test "carga/*.test.mjs" "ferramentas/*.test.mjs"
        working-directory: .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: codigo-fonte/frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Sem API no CI: as páginas viram renderização por pedido em vez de quebrar o build
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codigo-fonte/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # Publica a API de produção (Render) só num push na main e só com a API e o site aprovados.
  # O deploy hook é a URL secreta do Render (Settings → Deploy Hook) guardada no segredo
  # RENDER_DEPLOY_HOOK_PRODUCAO do repositório; nunca vai para o log.
  deploy-producao:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mudou algo na API?
        id: mudou
        env:
          ANTES: ${{ github.event.before }}
        run: |
          if [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$ANTES" 2>/dev/null; then
            echo "api=sim" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$ANTES" "$GITHUB_SHA" -- codigo-fonte/backend render.producao.yaml; then
            echo "api=nao" >> "$GITHUB_OUTPUT"; echo "Nada mudou na API: sem deploy."
          else
            echo "api=sim" >> "$GITHUB_OUTPUT"
          fi
      - name: Chamar o deploy hook do Render
        if: steps.mudou.outputs.api == 'sim'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_PRODUCAO }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Segredo RENDER_DEPLOY_HOOK_PRODUCAO não configurado: a API não foi publicada."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST --max-time 30 "$HOOK" || echo "000")
          echo "Render respondeu HTTP $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
